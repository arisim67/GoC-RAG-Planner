    <link rel="stylesheet" href="../css/themes.css" />
    <!-- The theme picked in the planner, before first paint (same as index.html) -->
    <script>
      try {
        var t = localStorage.getItem('goc_theme');
        if (t && t !== 'dark' && /^[a-z]+$/.test(t)) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/guide.css" />
  </head>

  <body>
    <div class="app-header guide-header">
      <div class="app-title app-title-grow">
        <a class="app-name guide-home" href="../" title="Open the planner"
          ><span class="app-logo" aria-hidden="true"></span
          ><span class="app-name-text">Darkwick Accord<small>Privacy Policy</small></span></a
        >
        <a class="header-link" href="../"
          ><svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M3 9h18" />
            <path d="M3 15h18" />
            <path d="M9 3v18" /></svg
          ><span>Open the planner</span></a
        >
      </div>
    </div>

    <!-- Drawn from PRIVACY.md by js/guide.js, so the policy has one source that GitHub shows too -->

    </main>

    <script type="module" src="../js/guide.js"></script>
  </body>
